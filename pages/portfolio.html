<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio | Shaazia Stonehocker</title>

  <!-- Your existing global styles -->
  <link rel="stylesheet" href="../css/styles.css" />

  <style>
    /* ---------- Portfolio (page-local best-practice styles) ---------- */
    :root{
      --ink:#111;
      --muted:#666;
      --border:#e9e9e9;
      --panel:#fafafa;
      --shadow: 0 14px 34px rgba(0,0,0,.06);
      --shadowHover: 0 18px 46px rgba(0,0,0,.10);
      --radius: 18px;
      --max: 1120px;
    }

    /* A11y: skip link */
    .skip-link{
      position:absolute;
      left:-999px;
      top:10px;
      background:#fff;
      border:1px solid var(--border);
      padding:10px 12px;
      border-radius: 12px;
      z-index:999;
    }
    .skip-link:focus{ left:10px; }

    .wrap{
      max-width: var(--max);
      margin: 0 auto;
      padding: 56px 20px 88px;
    }
    @media (max-width: 680px){
      .wrap{ padding-top: 40px; }
    }

    .kicker{
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 12px;
    }

    h1{
      font-size: 44px;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin: 0 0 12px;
      font-weight: 650;
      color: var(--ink);
    }
    @media (max-width: 680px){
      h1{ font-size: 32px; }
    }

    .lede{
      font-size: 17px;
      line-height: 1.85;
      color: #333;
      margin: 0 0 16px;
      max-width: 92ch;
    }

    .metaRow{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin: 14px 0 18px;
    }
    .chip{
      font-size: 12px;
      color:#555;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 10px;
      background: #fff;
    }

    .ctaRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top: 10px;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      text-decoration:none;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      background: #fff;
      color: var(--ink);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .btn:hover{
      background:#f7f7f7;
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }
    .btnPrimary{
      background:#111;
      color:#fff;
      border-color:#111;
    }
    .btnPrimary:hover{
      background:#000;
      border-color:#000;
    }

    /* Section headers */
    .sectionTitle{
      font-size: 20px;
      margin: 34px 0 10px;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    .sectionNote{
      font-size: 14px;
      color: var(--muted);
      margin: 0 0 18px;
      line-height: 1.75;
      max-width: 92ch;
    }

    /* Grid + cards */
    .grid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 18px;
    }

    .card{
      grid-column: span 4;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow:hidden;
      background: #fff;
      box-shadow: var(--shadow);
      transition: transform .18s ease, box-shadow .18s ease;
      display:flex;
      flex-direction:column;
      min-height: 100%;
    }
    .card:hover{
      transform: translateY(-2px);
      box-shadow: var(--shadowHover);
    }

    @media (max-width: 980px){
      .card{ grid-column: span 6; }
    }
    @media (max-width: 680px){
      .card{ grid-column: span 12; }
    }

    .thumb{
      position: relative;
      aspect-ratio: 16 / 9;
      background: #eee;
      overflow:hidden;
    }
    .thumb img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      transform: scale(1.01);
      transition: transform .25s ease;
    }
    .card:hover .thumb img{
      transform: scale(1.04);
    }
    .thumb::after{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(to top, rgba(0,0,0,.45), rgba(0,0,0,0));
      pointer-events:none;
      opacity: .85;
    }

    .cardBody{
      padding: 16px 16px 14px;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }

    .cardTitle{
      font-size: 18px;
      margin: 0;
      color: var(--ink);
      letter-spacing: -0.01em;
      line-height: 1.25;
    }
    .cardTitle a{
      color: inherit;
      text-decoration: none;
    }
    .cardTitle a:focus-visible{
      outline: 3px solid #111;
      outline-offset: 3px;
      border-radius: 10px;
    }

    .cardMeta{
      font-size: 13px;
      color: var(--muted);
